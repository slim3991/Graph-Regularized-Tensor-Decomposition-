[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-regularized-tensor-decomposition"
version = "0.1.0"
description = "Graph-regularized CP tensor decomposition with a conjugate gradient Sylvester solver"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.3",
    "scikit-learn>=1.6",
    "scipy>=1.14",
    "tensorly>=0.9.0",
]

[tool.setuptools]
py-modules = ["grcp"]
package-dir = {"" = "src"}
